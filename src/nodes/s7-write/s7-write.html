<script type="text/javascript">
  RED.nodes.registerType('s7-write', {
    category: 'S7 Suite',
    color: '#4FC3F7',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 's7-config', required: true },
      // Single and struct modes need an address, or the name of the property holding one
      address: {
        value: '',
        validate: function (v) {
          var mode = $('#node-input-mode').val() || this.mode || 'single';
          return mode === 'multi' || String(v === undefined || v === null ? '' : v).trim() !== '';
        }
      },
      mode: { value: 'single' },
      schema: { value: '[]' },
      // typedInput type of address: 'str' (a fixed address) or msg/flow/global/env
      addressType: { value: 'str' },
      // Where the schema comes from: 'config' (Fixed: set in this node) or msg/flow/global
      schemaType: { value: 'config' },
      schemaProp: { value: '' }
    },
    inputs: 1,
    outputs: 1,
    icon: 's7-suite.svg',
    paletteLabel: 'S7 Write',
    label: function () {
      if (this.name) return this.name;
      if (this.addressType && this.addressType !== 'str') return this.addressType + '.' + (this.address || '');
      return this.address || 'S7 Write';
    },
    oneditprepare: function () {
      var node = this;
      s7SuiteStatusDot('#node-input-server', '#s7w-status-dot');
      s7SuiteBrowseDialog({
        btnId: '#s7w-browse-btn',
        closeId: '#s7w-browse-close',
        filterId: '#s7w-browse-filter',
        statusId: '#s7w-browse-status',
        resultsId: '#s7w-browse-results',
        dialogId: '#s7w-browse-dialog',
        serverId: '#node-input-server',
        addressId: '#node-input-address',
        mode: 'replace',
        refreshId: '#s7w-browse-refresh'
      });

      // Schema editableList for struct mode
      var S7_TYPES = ['BOOL','BYTE','WORD','DWORD','INT','DINT','LINT','USINT','UINT','UDINT','ULINT','REAL','LREAL','CHAR','STRING','WSTRING','DATE','TIME','TIME_OF_DAY','S5TIME','DATE_AND_TIME','DT','DTZ','DTL','DTLZ'];
      var schemaList = $('#s7w-schema-list').css({ 'min-height': '150px' }).editableList({
        addButton: 'Add field',
        removable: true,
        sortable: true,
        addItem: function (row, index, data) {
          // Name takes the spare width; the rest are sized for their content
          var nameInput = $('<input type="text" placeholder="Field name" style="flex:1;min-width:80px;">').val(data.name || '');
          var typeSelect = $('<select style="flex:0 0 100px;">');
          S7_TYPES.forEach(function(t) {
            typeSelect.append($('<option>').val(t).text(t));
          });
          typeSelect.val(data.type || 'REAL');
          var offsetInput = $('<input type="number" placeholder="Offset" style="flex:0 0 80px;min-width:0;" min="0">').val(data.offset != null ? data.offset : '');
          var bitInput = $('<input type="number" placeholder="Bit" style="flex:0 0 60px;min-width:0;" min="0" max="7">').val(data.bit != null ? data.bit : '');
          var lenInput = $('<input type="number" placeholder="Str len" style="flex:0 0 80px;min-width:0;" min="1">').val(data.length != null ? data.length : '');

          function updateVisibility() {
            var t = typeSelect.val();
            bitInput.toggle(t === 'BOOL');
            lenInput.toggle(t === 'STRING' || t === 'WSTRING');
          }
          typeSelect.on('change', updateVisibility);

          $('<div style="display:flex;gap:4px;align-items:center;">')
            .append(nameInput, typeSelect, offsetInput, bitInput, lenInput)
            .appendTo(row);
          updateVisibility();
          // The Add button passes no data; loading a saved schema always does
          if (Object.keys(data).length === 0) {
            setTimeout(function () { nameInput.trigger('focus'); }, 0);
          }
        }
      });
      s7SuiteAccelerator(schemaList, 'a');

      // Load existing schema
      try {
        var schemaArr = JSON.parse(node.schema || '[]');
        if (Array.isArray(schemaArr)) {
          schemaArr.forEach(function (f) {
            schemaList.editableList('addItem', f);
          });
          // editableList scrolls to the bottom after every addItem (on a timeout); queue a
          // scroll back to the top after those so a reopened node starts at its first field
          setTimeout(function () {
            schemaList.closest('.red-ui-editableList-container').scrollTop(0);
          }, 0);
        }
      } catch (e) { /* ignore */ }

      // The address (single and struct modes): typed in, or taken from a property the user names.
      // Nothing in the message is used unless it is picked here.
      if (!node.addressType) $('#node-input-addressType').val('str');
      var addressInput = $('#node-input-address');
      // typedInput keeps one value across str/msg/env, so a typed address would become msg.DB1,REAL0.
      // Set it aside when leaving str, and bring it back on the way back.
      var fixedAddress = (node.addressType || 'str') === 'str' ? node.address : '';
      // typedInput fires change for value edits too; only a change of type swaps the value
      var lastType = node.addressType || 'str';
      addressInput.typedInput({
        default: 'str',
        types: ['str', 'msg', 'flow', 'global', 'env'],
        typeField: '#node-input-addressType'
      }).on('change', function (event, type, value) {
        var typeChanged = type !== lastType;
        lastType = type;
        var isAddress = /^(DB\d+[,.]|[MIQCTEA][A-Z]*\d)/i.test(value || '');
        if (!typeChanged) {
          // Leave what the user typed alone
        } else if (type === 'str') {
          if (fixedAddress && !isAddress) addressInput.typedInput('value', fixedAddress);
        } else {
          if (isAddress) fixedAddress = value;
          // Picking msg starts from msg.topic, so the old behaviour is one click away. Only replace
          // an address, the msg.topic default or nothing; keep a property the user typed.
          var start = type === 'msg' ? 'topic' : '';
          if ((isAddress || !value || value === 'topic') && value !== start) {
            addressInput.typedInput('value', start);
          }
        }
        $('#s7w-browse-btn').toggle(type === 'str');
        // The schema typedInput may not exist yet while this one initialises
        if ($('#node-input-schemaProp').data('noderedTypedInput')) {
          updateModeUI();
          RED.tray.resize();
        }
      });
      $('#s7w-browse-btn').toggle($('#node-input-address').typedInput('type') === 'str');

      // Where the schema comes from: Fixed (the list below) or a property the user names
      if (!node.schemaType) $('#node-input-schemaType').val('config');
      $('#node-input-schemaProp').typedInput({
        default: 'config',
        types: [{ value: 'config', label: 'Fixed', icon: 'fa fa-list', hasValue: false }, 'msg', 'flow', 'global'],
        typeField: '#node-input-schemaType'
      }).on('change', function (event, type) {
        if (type === 'msg' && !$('#node-input-schemaProp').typedInput('value')) {
          $('#node-input-schemaProp').typedInput('value', 'schema');
        }
        updateModeUI();
        RED.tray.resize();
      });

      // How a source reads in a tip: msg.topic, flow.x, global.x or env var X
      function sourceName(input) {
        var type = input.typedInput('type');
        var value = input.typedInput('value');
        return type === 'env' ? 'env var ' + value : type + '.' + value;
      }

      // Toggle UI sections based on mode and where the address and schema come from
      function updateModeUI() {
        var mode = $('#node-input-mode').val();
        var addressHere = addressInput.typedInput('type') === 'str';
        var schemaHere = $('#node-input-schemaProp').typedInput('type') === 'config';
        $('#s7w-single-hint').toggle(mode === 'single');
        $('#s7w-multi-hint').toggle(mode === 'multi');
        $('#s7w-struct-hint').toggle(mode === 'struct');
        $('#s7w-single-section').toggle(mode !== 'multi');
        // The browser fills the fixed address; close it when there is none to fill
        if (mode === 'multi' || !addressHere) $('#s7w-browse-dialog').hide();
        $('#s7w-address-label').text(mode === 'struct' ? ' Base address' : ' Address');
        $('#s7w-address-fixed-tip').toggle(addressHere);
        $('#s7w-address-fixed-tip .s7w-fixed-single').toggle(mode !== 'struct');
        $('#s7w-address-fixed-tip .s7w-fixed-struct').toggle(mode === 'struct');
        $('#s7w-address-src-tip').toggle(!addressHere);
        $('.s7w-address-src').text(sourceName(addressInput));
        $('#s7w-schema-section').toggle(mode === 'struct');
        $('#s7w-schema-section .s7w-list-row').toggle(schemaHere);
        $('#s7w-schema-src-tip').toggle(!schemaHere);
        $('.s7w-schema-src').text(sourceName($('#node-input-schemaProp')));
        s7SuiteAccelerator(schemaList, 'a', mode === 'struct' && schemaHere);
      }

      $('#node-input-mode').on('change', function () {
        updateModeUI();
        // The schema list may have appeared or gone; let oneditresize size it
        RED.tray.resize();
      });
      updateModeUI();
    },
    oneditsave: function () {
      var mode = $('#node-input-mode').val();

      // Save the schema list (struct mode); the address is the shared typedInput field
      if (mode === 'struct') {
        var schemaItems = $('#s7w-schema-list').editableList('items');
        var schema = [];
        schemaItems.each(function () {
          var inputs = $(this).find('input');
          var select = $(this).find('select');
          var name = $(inputs[0]).val();
          var type = select.val();
          var offset = parseInt($(inputs[1]).val(), 10);
          var bit = $(inputs[2]).val();
          var len = $(inputs[3]).val();
          if (name && !isNaN(offset)) {
            var field = { name: name, type: type, offset: offset };
            if (type === 'BOOL' && bit !== '') field.bit = parseInt(bit, 10);
            if ((type === 'STRING' || type === 'WSTRING') && len !== '') field.length = parseInt(len, 10);
            schema.push(field);
          }
        });
        this.schema = JSON.stringify(schema);
      }
    },
    oneditresize: function (size) {
      // Give the schema list the height the other rows leave, as the change and switch nodes do,
      // so a long schema scrolls inside the list instead of stretching the whole panel
      var section = $('#s7w-schema-section');
      if (!section.is(':visible')) return;
      var height = size.height;
      $('#dialog-form > div:visible').not(section).each(function () {
        height -= $(this).outerHeight(true);
      });
      var listRow = section.children('.s7w-list-row');
      // Visible ones only: jQuery measures a hidden element as if it were shown
      section.children(':visible').not(listRow).each(function () {
        height -= $(this).outerHeight(true);
      });
      height -= parseInt(listRow.css('marginTop'), 10) + parseInt(listRow.css('marginBottom'), 10);
      $('#s7w-schema-list').editableList('height', Math.max(150, height));
    }
  });
</script>

<script type="text/html" data-template-name="s7-write">
  <style>
    /* Tips sit under the input column and follow the tray's width: width 0 keeps their text from
       widening the tray when it opens, min-width then fills the column */
    .s7-tip { box-sizing: border-box; width: 0; min-width: 70%; max-width: none; margin: 0 0 12px 104px; }
    .s7-tip code { white-space: normal; overflow-wrap: anywhere; }
    .s7-tip p:last-child { margin-bottom: 0; }
  </style>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-server"></i> Server</label>
    <div style="display:inline-flex;width:70%;align-items:center;">
      <input type="text" id="node-input-server" style="flex:1;">
      <span id="s7w-status-dot" style="width:12px;height:12px;border-radius:50%;background:#999;display:inline-block;margin-left:6px;flex-shrink:0;" title="Connection status"></span>
    </div>
  </div>
  <div class="form-row">
    <label for="node-input-mode"><i class="fa fa-list"></i> Mode</label>
    <select id="node-input-mode" style="width:70%;">
      <option value="single">Single value</option>
      <option value="multi">Multi-write</option>
      <option value="struct">Struct write</option>
    </select>
  </div>
  <div id="s7w-single-hint" class="form-tips s7-tip">
    <p>Writes <code>msg.payload</code> to the address.</p>
  </div>
  <div id="s7w-multi-hint" style="display:none;" class="form-tips s7-tip">
    <p>Writes multiple values at once. <code>msg.payload</code> must be an object where each key is an S7 address and each value is the data to write.</p>
    <p>Example: <code>{"MB0": 255, "MW2": 1234, "DB1,REAL0": 23.5}</code></p>
  </div>
  <div id="s7w-struct-hint" style="display:none;" class="form-tips s7-tip">
    <p>Writes structured data to a DB area. <code>msg.payload</code> is an object with field names matching the schema.</p>
    <p>Example: <code>{"temperature": 23.5, "setpoint": 42, "motorOn": true}</code></p>
    <p>Uses read-modify-write to preserve bits not being written.</p>
  </div>
  <div id="s7w-single-section">
    <div class="form-row">
      <label for="node-input-address"><i class="fa fa-map-marker"></i><span id="s7w-address-label"> Address</span></label>
      <div style="display:inline-flex;width:70%;">
        <!-- the typedInput fills this wrapper; on its own as a flex item it shrinks to its content -->
        <div style="flex:1;min-width:0;">
          <input type="text" id="node-input-address" style="width:100%;">
        </div>
        <input type="hidden" id="node-input-addressType">
        <button type="button" id="s7w-browse-btn" class="red-ui-button" style="margin-left:4px;" title="Browse PLC addresses"><i class="fa fa-search"></i></button>
      </div>
    </div>
    <div id="s7w-address-fixed-tip" class="form-tips s7-tip">
      <p class="s7w-fixed-single">The address to write, for example <code>"DB1,REAL0"</code>, <code>"MW10"</code>
      or <code>"Q0.1"</code>.</p>
      <p class="s7w-fixed-struct">Where the schema offsets start, for example <code>"DB1,BYTE0"</code> or
      <code>"DB10,BYTE20"</code>.</p>
    </div>
    <div id="s7w-address-src-tip" class="form-tips s7-tip" style="display:none;">
      <p><code class="s7w-address-src">msg.topic</code> must hold one address string, for example <code>"DB1,REAL0"</code>.</p>
    </div>
    <div id="s7w-browse-dialog" style="display:none;border:1px solid #ccc;border-radius:4px;padding:8px;margin:0 0 12px;background:#fafafa;max-height:400px;overflow:hidden;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <b><i class="fa fa-sitemap"></i> PLC Address Browser</b>
        <div>
          <button type="button" id="s7w-browse-refresh" class="red-ui-button red-ui-button-small" style="margin-right:4px;"><i class="fa fa-refresh"></i></button>
          <button type="button" id="s7w-browse-close" class="red-ui-button red-ui-button-small"><i class="fa fa-times"></i></button>
        </div>
      </div>
      <input type="text" id="s7w-browse-filter" placeholder="Filter (e.g. DB1, REAL, Merker...)" style="width:100%;margin-bottom:6px;padding:4px;">
      <div id="s7w-browse-status" style="padding:8px;color:#666;display:none;"></div>
      <div id="s7w-browse-results" style="max-height:300px;overflow-y:auto;"></div>
    </div>
  </div>
  <div id="s7w-schema-section" style="display:none;">
    <div class="form-row">
      <label for="node-input-schemaProp"><i class="fa fa-th-list"></i> Schema</label>
      <input type="text" id="node-input-schemaProp" style="width:70%;">
      <input type="hidden" id="node-input-schemaType">
    </div>
    <div id="s7w-schema-src-tip" class="form-tips s7-tip" style="display:none;">
      <p><code class="s7w-schema-src">msg.schema</code> must hold the schema: an array of fields such as
      <code>[{"name": "temp", "type": "REAL", "offset": 0}]</code>, or the same as a JSON string. A BOOL
      field also takes <code>"bit"</code>, a STRING or WSTRING <code>"length"</code>.</p>
    </div>
    <div class="form-row s7w-list-row">
      <ol id="s7w-schema-list"></ol>
    </div>
  </div>
</script>

<script type="text/html" data-help-name="s7-write">
  <p>Writes data to a Siemens S7 PLC.</p>
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>The value to write. Format depends on selected mode (see below).</dd>
  </dl>
  <p>By default the node writes to the address and with the schema set in it, and nothing else in
  the message changes them. To take them from the message instead:</p>
  <dl class="message-properties">
    <dt class="optional">Address <span class="property-type">msg | flow | global | env</span></dt>
    <dd>Set the address type to name the property holding the address (single and struct
    modes), for example <code>msg.topic</code>. It must be one address string.</dd>
    <dt class="optional">Schema <span class="property-type">msg | flow | global</span></dt>
    <dd>The property holding the struct schema, as an array or a JSON string (struct mode only).
    Choosing <code>msg</code> starts from <code>msg.schema</code>.</dd>
    <dt class="optional">action <span class="property-type">string</span></dt>
    <dd>With <b>Dynamic control</b> on in the <code>s7-config</code>: <code>connect</code>, <code>disconnect</code>,
    <code>reconnect</code> or <code>status</code>. The message then acts on the connection instead of writing;
    <code>status</code> sends the connection report as <code>msg.payload</code>. See the <code>s7-config</code> help.
    Ignored while Dynamic control is off.</dd>
  </dl>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>Pass-through of the input message on successful write</dd>
  </dl>
  <h3>Write Modes</h3>
  <dl>
    <dt>Single value</dt>
    <dd>Writes <code>msg.payload</code> to the address. For an address with a length
    (<code>DB1,INT20.3</code>), send an array of that many values, or a <code>Buffer</code> for a byte array.</dd>
    <dt>Multi-write</dt>
    <dd>Writes multiple values at once. <code>msg.payload</code> must be an object where each key is an S7 address and each value is the data to write.
    <pre>{"MB0": 255, "MW2": 1234, "DB1,REAL0": 23.5}</pre></dd>
    <dt>Struct write</dt>
    <dd>Writes structured data to a DB area using a schema. <code>msg.payload</code> is an object with field names matching the schema.
    Uses read-modify-write to preserve bits not being written.
    <pre>{"temperature": 23.5, "setpoint": 42, "motorOn": true}</pre>
    Schema example:
    <pre>[{"name":"temperature","type":"REAL","offset":0},
 {"name":"setpoint","type":"INT","offset":4},
 {"name":"motorOn","type":"BOOL","offset":6,"bit":0}]</pre>
    Only fields present in <code>msg.payload</code> are written; others are left unchanged.</dd>
  </dl>
  <h4>Address Formats</h4>
  <ul>
    <li><b>nodes7:</b> <code>DB1,REAL0</code>, <code>DB1,BOOL0.0</code>, <code>DB1,INT4</code></li>
    <li><b>IEC:</b> <code>DB1.DBD0</code>, <code>DB1.DBX0.0</code>, <code>DB1.DBW4</code></li>
    <li><b>Area:</b> <code>MW0</code>, <code>Q0.0</code>, <code>IB2</code></li>
  </ul>
  <h4>Data Type Mapping</h4>
  <ul>
    <li><b>BOOL:</b> <code>true</code>/<code>false</code></li>
    <li><b>Arrays:</b> an address with a length takes an array of that many values: <code>DB1,INT20.3</code>
      is 3 INTs and <code>DB1,X10.3.8</code> is 8 consecutive bits from bit 3 of byte 10. A byte array
      (<code>DB1,BYTE10.4</code>) also takes a Buffer. A value of the wrong length is rejected.</li>
    <li><b>BYTE/WORD/DWORD:</b> unsigned integer</li>
    <li><b>INT/DINT:</b> signed integer</li>
    <li><b>REAL/LREAL:</b> floating point number</li>
    <li><b>STRING:</b> text string. <code>DB1,STRING50.20</code> is a <code>STRING[20]</code> at offset 50; the
      length can be left off when the string is already declared in the PLC. Only the string's current length
      and characters are written, never its max length, and a value longer than the max length is rejected.</li>
    <li><b>LINT/ULINT:</b> a number, a BigInt or an integer string. Use a BigInt or a string for values past
      2^53, which a number can't hold exactly.</li>
    <li><b>DT/DTL:</b> a <code>Date</code>, an ISO string or milliseconds since 1970, stored as the server's
      local time. <b>DTZ/DTLZ</b> are the same in UTC. DT holds 1990 to 2089, DTL 1970 to 2262. Use DT
      for a PLC <code>DATE_AND_TIME</code> and DTL for a <code>DTL</code>; use the Z form when the PLC keeps
      UTC rather than its local clock.</li>
  </ul>
</script>
