<script type="text/javascript">
  RED.nodes.registerType('s7-trigger', {
    category: 'S7 Suite',
    color: '#4FC3F7',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 's7-config', required: true },
      address: { value: '', required: true },
      // A number, or (type env) the name of an environment variable holding one. The validator
      // lives in s7-config.html; look it up when called rather than when this file loads.
      interval: {
        value: 1000,
        validate: function (v) { return s7SuiteNumberField('intervalType', 1, Number.MAX_SAFE_INTEGER).call(this, v); }
      },
      intervalType: { value: 'num' },
      edgeMode: { value: 'any' },
      deadband: {
        value: 0,
        validate: function (v) { return s7SuiteNumberField('deadbandType', 0, Number.MAX_VALUE, true).call(this, v); }
      },
      deadbandType: { value: 'num' }
    },
    inputs: 0,
    outputs: 1,
    icon: 's7-suite.svg',
    paletteLabel: 'S7 Trigger',
    label: function () {
      return this.name || this.address || 'S7 Trigger';
    },
    oneditprepare: function () {
      s7SuiteStatusDot('#node-input-server', '#s7t-status-dot');
      s7SuiteBrowseDialog({
        btnId: '#s7t-browse-btn',
        closeId: '#s7t-browse-close',
        filterId: '#s7t-browse-filter',
        statusId: '#s7t-browse-status',
        resultsId: '#s7t-browse-results',
        dialogId: '#s7t-browse-dialog',
        serverId: '#node-input-server',
        addressId: '#node-input-address',
        mode: 'replace',
        refreshId: '#s7t-browse-refresh'
      });
      // Interval and deadband take a number or an environment variable, as s7-config's fields do.
      // Nodes saved before this have no type and open as num.
      ['interval', 'deadband'].forEach(function (field) {
        $('#node-input-' + field).typedInput({
          default: 'num',
          types: ['num', 'env'],
          typeField: '#node-input-' + field + 'Type'
        });
      });
    }
  });
</script>

<script type="text/html" data-template-name="s7-trigger">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-server"></i> Server</label>
    <div style="display:inline-flex;width:70%;align-items:center;">
      <input type="text" id="node-input-server" style="flex:1;">
      <span id="s7t-status-dot" style="width:12px;height:12px;border-radius:50%;background:#999;display:inline-block;margin-left:6px;flex-shrink:0;" title="Connection status"></span>
    </div>
  </div>
  <div class="form-row">
    <label for="node-input-address"><i class="fa fa-map-marker"></i> Address</label>
    <div style="display:inline-flex;width:70%;">
      <input type="text" id="node-input-address" placeholder="DB1,BOOL0.0" style="flex:1;">
      <button type="button" id="s7t-browse-btn" class="red-ui-button" style="margin-left:4px;" title="Browse PLC addresses"><i class="fa fa-search"></i></button>
    </div>
  </div>
  <div class="form-row">
    <label for="node-input-interval"><i class="fa fa-clock-o"></i> Interval (ms)</label>
    <input type="text" id="node-input-interval" placeholder="1000" style="width:70%;">
    <input type="hidden" id="node-input-intervalType">
  </div>
  <div class="form-row">
    <label for="node-input-edgeMode"><i class="fa fa-line-chart"></i> Edge Mode</label>
    <select id="node-input-edgeMode">
      <option value="any">Any change</option>
      <option value="rising">Rising edge</option>
      <option value="falling">Falling edge</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-input-deadband"><i class="fa fa-sliders"></i> Deadband</label>
    <input type="text" id="node-input-deadband" placeholder="0" style="width:70%;">
    <input type="hidden" id="node-input-deadbandType">
  </div>
  <div id="s7t-browse-dialog" style="display:none;border:1px solid #ccc;border-radius:4px;padding:8px;margin-top:8px;background:#fafafa;max-height:400px;overflow:hidden;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <b><i class="fa fa-sitemap"></i> PLC Address Browser</b>
      <div>
        <button type="button" id="s7t-browse-refresh" class="red-ui-button red-ui-button-small" style="margin-right:4px;"><i class="fa fa-refresh"></i></button>
        <button type="button" id="s7t-browse-close" class="red-ui-button red-ui-button-small"><i class="fa fa-times"></i></button>
      </div>
    </div>
    <input type="text" id="s7t-browse-filter" placeholder="Filter (e.g. DB1, REAL, Merker...)" style="width:100%;margin-bottom:6px;padding:4px;">
    <div id="s7t-browse-status" style="padding:8px;color:#666;display:none;"></div>
    <div id="s7t-browse-results" style="max-height:300px;overflow-y:auto;"></div>
  </div>
  <div class="form-tips">
    <p>Polls the specified address(es) and emits a message when the value changes.</p>
    <p>Edge mode applies to boolean values. Deadband applies to numeric values.</p>
    <p><b>Dynamic sim values:</b> DB1,REAL20 (sine), DB1,DINT24 (counter), DB1,REAL28 (sawtooth).</p>
  </div>
</script>

<script type="text/html" data-help-name="s7-trigger">
  <p>Polls a Siemens S7 PLC address at a configurable interval and triggers on value changes.</p>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>The new value read from the PLC</dd>
    <dt>topic <span class="property-type">string</span></dt>
    <dd>The address that changed</dd>
    <dt>oldValue <span class="property-type">any</span></dt>
    <dd>The previous value: for a boolean, the value at the previous poll; for a number with a
    deadband, the value last sent. Not set on the first message.</dd>
    <dt>s7 <span class="property-type">object</span></dt>
    <dd>The same details as <code>s7-read</code> and <code>s7-write</code> send: <code>op</code>
    (<code>"trigger"</code>), <code>server</code> (the <code>s7-config</code>'s name, or host:port),
    <code>source</code> (<code>"config"</code>), <code>address</code> (the address that changed, as in
    <code>msg.topic</code>), <code>timestamp</code> (when the message was sent, ms since 1970) and
    <code>durationMs</code> (from the start of the poll that saw the change).</dd>
  </dl>
  <h3>Details</h3>
  <p>The node polls the configured address at the specified interval and only sends
  a message when the value changes, based on the edge mode and deadband settings.</p>
  <p>The node has no input: it is configured here, and starts polling once the PLC is connected.</p>
  <h4>Polling Interval</h4>
  <p>Time in milliseconds between PLC reads, a whole number of 1 or more. Default: 1000ms. Polling starts
  automatically when the PLC connection is established and pauses during disconnection.</p>
  <h4>Environment variables</h4>
  <p><b>Interval</b> and <b>Deadband</b> each take a number or, by switching the field to <b>env</b>, the
  name of an environment variable (Node-RED's flow or global environment variables, or the process
  environment), so one flow can poll differently per deployment. An unset variable, or one that isn't a
  usable number, stops the node with an error rather than falling back to a default.</p>
  <h4>Edge Mode</h4>
  <ul>
    <li><b>Any change:</b> Triggers on any value change (default). The first poll sends the starting value.</li>
    <li><b>Rising edge:</b> Triggers each time a boolean changes from false to true</li>
    <li><b>Falling edge:</b> Triggers each time a boolean changes from true to false</li>
  </ul>
  <p>In rising and falling mode the first poll of a boolean only records its starting value and sends
  nothing, because a starting value is not an edge. Other types trigger as in <b>Any change</b>, and
  their first poll is sent.</p>
  <h4>Deadband</h4>
  <p>For numeric values, the smallest absolute change that sends a message, 0 or more (fractions
  allowed). The change is measured from the value last sent, so a slow drift still triggers once it
  adds up to the deadband: with a deadband of 5, 10 then 13 then 16 sends 10 and 16. Set to 0 to
  trigger on any change. Useful for filtering noise on analog signals.</p>
  <h4>Multiple Addresses</h4>
  <p>Enter multiple addresses separated by spaces or semicolons. Each address is
  monitored independently and sends separate messages when changed.</p>
</script>
