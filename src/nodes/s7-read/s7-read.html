<script type="text/javascript">
  RED.nodes.registerType('s7-read', {
    category: 'S7 Suite',
    color: '#4FC3F7',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 's7-config', required: true },
      address: { value: '' },
      labels: { value: '{}' },
      outputMode: { value: 'single' },
      topic: { value: '' },
      schema: { value: '[]' },
      // Where the addresses and schema come from: 'config' (Fixed: set in this node) or msg/flow/global/env
      addressType: { value: 'config' },
      addressProp: { value: '' },
      schemaType: { value: 'config' },
      schemaProp: { value: '' }
    },
    inputs: 1,
    outputs: 1,
    icon: 's7-suite.svg',
    paletteLabel: 'S7 Read',
    label: function () {
      if (this.name) return this.name;
      if (this.addressType && this.addressType !== 'config') return this.addressType + '.' + (this.addressProp || '');
      return this.address || 'S7 Read';
    },
    oneditprepare: function () {
      var node = this;
      s7SuiteStatusDot('#node-input-server', '#s7r-status-dot');

      // editableList for addresses with optional labels
      var addrList = $('#s7r-address-list').css({ 'min-height': '150px' }).editableList({
        addButton: 'Add address',
        removable: true,
        sortable: true,
        addItem: function (row, index, data) {
          var addrVal = data.address || '';
          var labelVal = data.label || '';
          var container = $('<div style="display:flex;gap:4px;">');
          var addrInput = $('<input type="text" class="s7r-addr" placeholder="DB1,REAL0" style="flex:1;">').val(addrVal);
          var labelInput = $('<input type="text" class="s7r-label" placeholder="Label (optional)" style="flex:1;">').val(labelVal);
          container.append(addrInput, labelInput);
          row.append(container);
          // The Add button passes no data; loading, Import and Browse always do
          if (Object.keys(data).length === 0) {
            setTimeout(function () { addrInput.trigger('focus'); }, 0);
            seedFromPreviousRow(row, addrInput, labelInput);
          }
        }
      });

      // Start a new row from the one above: DB1,REAL0 suggests DB1,REAL4, and a label ending in a
      // number counts on (Temp1, Temp2). The guess is selected, so typing replaces it.
      function seedFromPreviousRow(row, addrInput, labelInput) {
        var previous = row.closest('li').prev('li');
        var prevAddr = (previous.find('.s7r-addr').val() || '').trim();
        if (!prevAddr) return;
        var prevLabel = (previous.find('.s7r-label').val() || '').trim();
        $.getJSON('s7-suite/next-address', { after: prevAddr }, function (result) {
          // Leave a row the user has already started typing in
          if (!result.address || addrInput.val()) return;
          addrInput.val(result.address);
          if (!labelInput.val()) labelInput.val(nextLabel(prevLabel));
          if (document.activeElement === addrInput[0]) addrInput[0].select();
        });
      }

      function nextLabel(label) {
        var m = /^(.*?)(\d+)$/.exec(label);
        if (!m) return '';
        // Keep leading zeros: Temp09 is followed by Temp10, Pump007 by Pump008
        var n = String(parseInt(m[2], 10) + 1);
        while (n.length < m[2].length) n = '0' + n;
        return m[1] + n;
      }
      s7SuiteAccelerator(addrList, 'a');

      // Load existing addresses with labels
      var existingLabels = {};
      try { existingLabels = JSON.parse(node.labels || '{}'); } catch(e) {}
      var existing = (node.address || '').trim();
      if (existing) {
        var parts = existing.split(/\s+/);
        parts.forEach(function (a) {
          if (a) addrList.editableList('addItem', { address: a, label: existingLabels[a] || '' });
        });
        scrollListToTop(addrList);
      }

      // editableList scrolls to the bottom after every addItem (on a timeout), which leaves a
      // reopened node showing the end of its list. Queue a scroll back to the top after those.
      function scrollListToTop(list) {
        setTimeout(function () {
          list.closest('.red-ui-editableList-container').scrollTop(0);
        }, 0);
      }

      // CSV/Excel/CFG/TIA-XML import
      var fileInput = $('<input type="file" accept=".csv,.tsv,.txt,.sdf,.xlsx,.xls,.xlsm,.xlsb,.ods,.cfg,.xml" style="display:none;">');
      $('body').append(fileInput);

      $('#s7r-import-btn').on('click', function () {
        fileInput.trigger('click');
      });

      fileInput.on('change', function (evt) {
        var file = evt.target.files[0];
        if (!file) return;
        var name = (file.name || '').toLowerCase();
        var isExcel = /\.(xlsx|xls|xlsm|xlsb|ods)$/i.test(name);
        var isCfg = /\.cfg$/i.test(name);
        var isXml = /\.xml$/i.test(name);

        if (isXml) {
          var xmlReader = new FileReader();
          xmlReader.onload = function (e) {
            try {
              $.ajax({
                url: 's7-suite/tia-xml-import',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ content: e.target.result }),
                success: function (result) {
                  var tags = (result && result.tags) || [];
                  var usable = tags.filter(function (t) { return t.address; });
                  if (tags.length === 0) {
                    RED.notify('No tags found in "' + file.name + '". Expected a TIA Portal tag table exported as XML.', 'warning');
                  } else if (usable.length === 0) {
                    RED.notify('No addressed tags found in "' + file.name + '". User constants are skipped (no address).', 'warning');
                  } else {
                    usable.forEach(function (t) {
                      addrList.editableList('addItem', { address: t.address, label: t.name });
                    });
                    var tableLabel = (result.tables || []).length > 0
                      ? ' (' + result.tables.length + ' table' + (result.tables.length > 1 ? 's' : '') + ')'
                      : '';
                    RED.notify('Imported ' + usable.length + ' tag(s) from "' + file.name + '"' + tableLabel + '.', 'success');
                  }
                },
                error: function (xhr) {
                  var msg = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : 'Server-side parse failed';
                  RED.notify('Failed to import TIA XML: ' + msg, 'error');
                }
              });
            } catch (parseErr) {
              RED.notify('Failed to read XML file: ' + parseErr.message, 'error');
            }
            fileInput.val('');
          };
          xmlReader.readAsText(file, 'utf-8');
          return;
        }

        if (isCfg) {
          var cfgReader = new FileReader();
          cfgReader.onload = function (e) {
            try {
              // STEP 7 cfg exports are latin1; decode accordingly to preserve umlauts.
              var buf = new Uint8Array(e.target.result);
              var text;
              try {
                text = new TextDecoder('windows-1252').decode(buf);
              } catch (_decErr) {
                text = new TextDecoder('iso-8859-15').decode(buf);
              }
              $.ajax({
                url: 's7-suite/cfg-import',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ content: text }),
                success: function (result) {
                  var tags = (result && result.tags) || [];
                  if (tags.length === 0) {
                    RED.notify('No symbols found in "' + file.name + '". Make sure SYMBOLs are included in the STEP 7 export.', 'warning');
                  } else {
                    tags.forEach(function (t) {
                      addrList.editableList('addItem', { address: t.address, label: t.name });
                    });
                    var stationLabel = result.station ? (' (' + result.station.name + ')') : '';
                    RED.notify('Imported ' + tags.length + ' tag(s) from "' + file.name + '"' + stationLabel + '.', 'success');
                  }
                },
                error: function (xhr) {
                  var msg = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : 'Server-side parse failed';
                  RED.notify('Failed to import cfg: ' + msg, 'error');
                }
              });
            } catch (parseErr) {
              RED.notify('Failed to read cfg file: ' + parseErr.message, 'error');
            }
            fileInput.val('');
          };
          cfgReader.readAsArrayBuffer(file);
          return;
        }

        if (isExcel) {
          loadSheetJS(function (err, XLSX) {
            if (err || !XLSX) {
              RED.notify('Excel import requires SheetJS. Could not load library: ' + (err && err.message ? err.message : 'unknown error'), 'error');
              fileInput.val('');
              return;
            }
            var reader = new FileReader();
            reader.onload = function (e) {
              try {
                var data = new Uint8Array(e.target.result);
                var wb = XLSX.read(data, { type: 'array' });
                var sheetName = wb.SheetNames[0];
                var ws = wb.Sheets[sheetName];
                // Convert to CSV string and reuse the existing parser
                var csv = XLSX.utils.sheet_to_csv(ws, { FS: ';' });
                var imported = parseTagListCSV(csv);
                if (imported.length === 0) {
                  RED.notify('No tags found in Excel sheet "' + sheetName + '". Expected columns: name/symbol/tag and address.', 'warning');
                } else {
                  imported.forEach(function (item) { addrList.editableList('addItem', item); });
                  RED.notify('Imported ' + imported.length + ' tag(s) from "' + file.name + '".', 'success');
                }
              } catch (parseErr) {
                RED.notify('Failed to parse Excel file: ' + parseErr.message, 'error');
              }
              fileInput.val('');
            };
            reader.readAsArrayBuffer(file);
          });
        } else {
          var reader = new FileReader();
          reader.onload = function (e) {
            var text = e.target.result;
            var isSdf = /\.sdf$/i.test(name);
            var imported = isSdf ? parseTagListSDF(text) : parseTagListCSV(text);
            if (imported.length === 0) {
              RED.notify(isSdf
                ? 'No tags found in "' + file.name + '". Expected one tag per line: "name","address","data type",...'
                : 'No tags found. Expected a header row with columns: name/symbol/tag and address.', 'warning');
            } else {
              imported.forEach(function (item) { addrList.editableList('addItem', item); });
              RED.notify('Imported ' + imported.length + ' tag(s) from "' + file.name + '".', 'success');
            }
            fileInput.val('');
          };
          reader.readAsText(file);
        }
      });

      // Lazy-load SheetJS from CDN (no runtime npm dependency)
      var _sheetJsLoading = null;
      function loadSheetJS(callback) {
        if (typeof window.XLSX !== 'undefined') {
          callback(null, window.XLSX);
          return;
        }
        if (_sheetJsLoading) {
          _sheetJsLoading.push(callback);
          return;
        }
        _sheetJsLoading = [callback];
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
        script.onload = function () {
          var cbs = _sheetJsLoading || [];
          _sheetJsLoading = null;
          cbs.forEach(function (cb) { cb(null, window.XLSX); });
        };
        script.onerror = function () {
          var cbs = _sheetJsLoading || [];
          _sheetJsLoading = null;
          cbs.forEach(function (cb) { cb(new Error('Failed to load SheetJS from CDN. Check your internet connection or export the file as CSV.')); });
        };
        document.head.appendChild(script);
      }

      // Parse CSV/TSV tag lists (TIA Portal, Step 7, generic)
      function parseTagListCSV(text) {
        var lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        if (lines.length < 2) return [];

        // Detect separator: tab, semicolon, or comma
        var sep = '\t';
        var header = lines[0];
        if (header.indexOf('\t') >= 0) sep = '\t';
        else if (header.indexOf(';') >= 0) sep = ';';
        else sep = ',';

        var cols = header.split(sep).map(function (c) { return c.trim().replace(/^["']|["']$/g, '').toLowerCase(); });

        // Find relevant columns by common names
        var nameIdx = findCol(cols, ['name', 'symbol', 'tag', 'tagname', 'tag name', 'bezeichnung']);
        var addrIdx = findCol(cols, ['address', 'logical address', 'logische adresse', 'adresse', 'operand', 'plc tag', 'absolute address']);
        var typeIdx = findCol(cols, ['data type', 'datatype', 'type', 'datentyp', 'typ']);

        if (addrIdx < 0) return [];

        var results = [];
        for (var i = 1; i < lines.length; i++) {
          var fields = lines[i].split(sep).map(function (c) { return c.trim().replace(/^["']|["']$/g, ''); });
          var addr = fields[addrIdx] || '';
          if (!addr) continue;

          // Convert IEC format (%DB1.DBD0 -> DB1.DBD0, %MW10 -> MW10)
          addr = addr.replace(/^%/, '');

          // Convert IEC I/Q prefix to nodes7 format if needed
          // %IW0 -> IW0, %QD4 -> QD4 (these are already valid)

          var label = nameIdx >= 0 ? (fields[nameIdx] || '') : '';

          results.push({ address: addr, label: label });
        }
        return results;
      }

      // Parse .sdf tag lists (TIA Portal tag table Export, "Save as type: Sdf"): no header row,
      // one quoted comma-separated line per tag: "name","address","data type",...
      function parseTagListSDF(text) {
        var results = [];
        text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').forEach(function (line) {
          if (!line.trim()) return;
          var fields = splitQuotedLine(line);
          // TIA prefixes addresses with %; drop any padding spaces too
          var addr = (fields[1] || '').replace(/\s+/g, '').replace(/^%/, '');
          if (!addr) return;
          results.push({ address: addr, label: (fields[0] || '').trim() });
        });
        return results;
      }

      // Split one comma-separated line, honouring "quoted, fields" and "" escapes
      function splitQuotedLine(line) {
        var fields = [];
        var cur = '';
        var inQuotes = false;
        for (var i = 0; i < line.length; i++) {
          var ch = line[i];
          if (inQuotes) {
            if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
            else if (ch === '"') { inQuotes = false; }
            else { cur += ch; }
          } else if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            fields.push(cur);
            cur = '';
          } else {
            cur += ch;
          }
        }
        fields.push(cur);
        return fields;
      }

      function findCol(cols, names) {
        for (var n = 0; n < names.length; n++) {
          for (var c = 0; c < cols.length; c++) {
            if (cols[c] === names[n]) return c;
          }
        }
        return -1;
      }

      // Browse dialog - appends to list
      s7SuiteBrowseDialog({
        btnId: '#s7r-browse-btn',
        closeId: '#s7r-browse-close',
        filterId: '#s7r-browse-filter',
        statusId: '#s7r-browse-status',
        resultsId: '#s7r-browse-results',
        dialogId: '#s7r-browse-dialog',
        serverId: '#node-input-server',
        addressId: null,
        mode: 'list',
        listRef: addrList,
        refreshId: '#s7r-browse-refresh'
      });

      // Schema editableList for struct mode
      var S7_TYPES = ['BOOL','BYTE','WORD','DWORD','INT','DINT','LINT','USINT','UINT','UDINT','ULINT','REAL','LREAL','CHAR','STRING','WSTRING','DATE','TIME','TIME_OF_DAY','S5TIME','DATE_AND_TIME','DT','DTZ','DTL','DTLZ'];
      var schemaList = $('#s7r-schema-list').css({ 'min-height': '150px' }).editableList({
        addButton: 'Add field',
        removable: true,
        sortable: true,
        addItem: function (row, index, data) {
          // Name takes the spare width; the rest are sized for their content
          var nameInput = $('<input type="text" placeholder="Field name" style="flex:1;min-width:80px;">').val(data.name || '');
          var typeSelect = $('<select style="flex:0 0 100px;">');
          S7_TYPES.forEach(function(t) {
            typeSelect.append($('<option>').val(t).text(t));
          });
          typeSelect.val(data.type || 'REAL');
          var offsetInput = $('<input type="number" placeholder="Offset" style="flex:0 0 80px;min-width:0;" min="0">').val(data.offset != null ? data.offset : '');
          var bitInput = $('<input type="number" placeholder="Bit" style="flex:0 0 60px;min-width:0;" min="0" max="7">').val(data.bit != null ? data.bit : '');
          var lenInput = $('<input type="number" placeholder="Str len" style="flex:0 0 80px;min-width:0;" min="1">').val(data.length != null ? data.length : '');

          function updateVisibility() {
            var t = typeSelect.val();
            bitInput.toggle(t === 'BOOL');
            lenInput.toggle(t === 'STRING' || t === 'WSTRING');
          }
          typeSelect.on('change', updateVisibility);

          $('<div style="display:flex;gap:4px;align-items:center;">')
            .append(nameInput, typeSelect, offsetInput, bitInput, lenInput)
            .appendTo(row);
          updateVisibility();
          // The Add button passes no data; loading a saved schema always does
          if (Object.keys(data).length === 0) {
            setTimeout(function () { nameInput.trigger('focus'); }, 0);
            // Same type at the next offset as the field above; the name is left to the user
            s7SuiteSeedSchemaField(row, { type: typeSelect, offset: offsetInput, bit: bitInput, len: lenInput });
          }
        }
      });
      s7SuiteAccelerator(schemaList, 'a');

      // Load existing schema
      try {
        var schemaArr = JSON.parse(node.schema || '[]');
        if (Array.isArray(schemaArr)) {
          schemaArr.forEach(function (f) {
            schemaList.editableList('addItem', f);
          });
          scrollListToTop(schemaList);
        }
      } catch (e) { /* ignore */ }

      // Toggle UI sections based on outputMode and where the addresses and schema come from
      // How a source reads in a tip: msg.topic, flow.x, global.x or env var X
      function sourceName(input) {
        var type = input.typedInput('type');
        var value = input.typedInput('value');
        return type === 'env' ? 'env var ' + value : type + '.' + value;
      }

      function updateModeUI() {
        var mode = $('#node-input-outputMode').val();
        var isAddressList = (mode === 'single' || mode === 'object');
        var addressesHere = $('#node-input-addressProp').typedInput('type') === 'config';
        var schemaHere = $('#node-input-schemaProp').typedInput('type') === 'config';
        $('#s7r-address-list-section').toggle(addressesHere && isAddressList);
        // The browser adds to that list; close it with the list so it is shut when the list comes back
        if (!(addressesHere && isAddressList)) $('#s7r-browse-dialog').hide();
        $('#s7r-single-address-section').toggle(addressesHere && !isAddressList);
        $('#s7r-schema-section').toggle(mode === 'struct');
        $('#s7r-schema-section .s7r-list-row').toggle(schemaHere);
        $('#s7r-buffer-hint').toggle(mode === 'buffer');
        $('#s7r-bits-hint').toggle(mode === 'bits');
        $('#s7r-struct-hint').toggle(mode === 'struct');
        // When the addresses or schema come from a property, say what it can hold
        $('#s7r-address-src-tip').toggle(!addressesHere);
        $('#s7r-address-src-tip .s7r-src-many').toggle(isAddressList);
        $('#s7r-address-src-tip .s7r-src-one').toggle(!isAddressList);
        $('#s7r-address-src-tip .s7r-src-single').toggle(mode === 'single');
        $('#s7r-address-src-tip .s7r-src-object').toggle(mode === 'object');
        $('.s7r-address-src').text(sourceName($('#node-input-addressProp')));
        $('#s7r-schema-src-tip').toggle(!schemaHere);
        $('.s7r-schema-src').text(sourceName($('#node-input-schemaProp')));
        // Both lists use Alt+A; only the visible one may own it
        s7SuiteAccelerator(addrList, 'a', addressesHere && isAddressList);
        s7SuiteAccelerator(schemaList, 'a', mode === 'struct' && schemaHere);
      }

      $('#node-input-outputMode').on('change', function () {
        updateModeUI();
        // A different list (or none) is now visible; let oneditresize size it
        RED.tray.resize();
      });

      // For buffer/struct/bits modes, show a single address input
      // Pre-fill single address from first address in list
      if (!isAddressListMode(node.outputMode)) {
        var firstAddr = (node.address || '').split(/\s+/)[0] || '';
        $('#s7r-single-address-input').val(firstAddr);
      }

      function isAddressListMode(mode) {
        return mode === 'single' || mode === 'object' || !mode;
      }

      // Where the addresses and schema come from: Fixed (the lists in this node), or a property the
      // user names. Nothing in the message is used unless it is picked here.
      var fromThisNode = { value: 'config', label: 'Fixed', icon: 'fa fa-list', hasValue: false };
      // Nodes saved before these settings existed read their own config
      if (!node.addressType) $('#node-input-addressType').val('config');
      if (!node.schemaType) $('#node-input-schemaType').val('config');
      function sourceInput(id, typeField, types, msgDefault) {
        $(id).typedInput({ default: 'config', types: [fromThisNode].concat(types), typeField: typeField })
          .on('change', function (event, type) {
            // Picking msg starts from the usual property, so the old msg.topic / msg.schema is one click away
            if (type === 'msg' && !$(id).typedInput('value')) $(id).typedInput('value', msgDefault);
            updateModeUI();
            RED.tray.resize();
          });
      }
      sourceInput('#node-input-addressProp', '#node-input-addressType', ['msg', 'flow', 'global', 'env'], 'topic');
      sourceInput('#node-input-schemaProp', '#node-input-schemaType', ['msg', 'flow', 'global'], 'schema');

      updateModeUI();
    },
    oneditresize: function (size) {
      // Give the visible list (addresses or schema) the height the other rows leave, as the
      // change and switch nodes do. Size it through editableList('height'): setting a CSS height
      // on the <ol> itself fights editableList's own scroll container.
      var height = size.height;
      $('#dialog-form > div:visible').not('#s7r-address-list-section, #s7r-schema-section').each(function () {
        height -= $(this).outerHeight(true);
      });
      $('#s7r-address-list-section:visible, #s7r-schema-section:visible').each(function () {
        var section = $(this);
        var listRow = section.children('.s7r-list-row');
        var listHeight = height;
        // Visible ones only: jQuery measures a hidden element as if it were shown
        section.children(':visible').not(listRow).each(function () {
          listHeight -= $(this).outerHeight(true);
        });
        listHeight -= parseInt(listRow.css('marginTop'), 10) + parseInt(listRow.css('marginBottom'), 10);
        listRow.find('ol').editableList('height', Math.max(150, listHeight));
      });
    },
    oneditsave: function () {
      var mode = $('#node-input-outputMode').val();

      if (mode === 'single' || mode === 'object') {
        // Collect addresses and labels from editableList
        var items = $('#s7r-address-list').editableList('items');
        var addresses = [];
        var labelMap = {};
        items.each(function () {
          var addr = $(this).find('.s7r-addr').val();
          var label = $(this).find('.s7r-label').val();
          if (addr && addr.trim()) {
            addresses.push(addr.trim());
            if (label && label.trim()) {
              labelMap[addr.trim()] = label.trim();
            }
          }
        });
        this.address = addresses.join(' ');
        this.labels = JSON.stringify(labelMap);
      } else {
        // Single address for buffer/struct/bits
        this.address = ($('#s7r-single-address-input').val() || '').trim();
      }

      // Save schema
      if (mode === 'struct') {
        var schemaItems = $('#s7r-schema-list').editableList('items');
        var schema = [];
        schemaItems.each(function () {
          var inputs = $(this).find('input');
          var select = $(this).find('select');
          var name = $(inputs[0]).val();
          var type = select.val();
          var offset = parseInt($(inputs[1]).val(), 10);
          var bit = $(inputs[2]).val();
          var len = $(inputs[3]).val();
          if (name && !isNaN(offset)) {
            var field = { name: name, type: type, offset: offset };
            if (type === 'BOOL' && bit !== '') field.bit = parseInt(bit, 10);
            if ((type === 'STRING' || type === 'WSTRING') && len !== '') field.length = parseInt(len, 10);
            schema.push(field);
          }
        });
        this.schema = JSON.stringify(schema);
      }
    }
  });
</script>

<script type="text/html" data-template-name="s7-read">
  <style>
    /* Tips sit under the input column and follow the tray's width: width 0 keeps their text from
       widening the tray when it opens, min-width then fills the column */
    .s7-tip { box-sizing: border-box; width: 0; min-width: 70%; max-width: none; margin: 0 0 12px 104px; }
    .s7-tip code { white-space: normal; overflow-wrap: anywhere; }
    .s7-tip p:last-child { margin-bottom: 0; }
  </style>
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-server"></i> Server</label>
    <div style="display:inline-flex;width:70%;align-items:center;">
      <input type="text" id="node-input-server" style="flex:1;">
      <span id="s7r-status-dot" style="width:12px;height:12px;border-radius:50%;background:#999;display:inline-block;margin-left:6px;flex-shrink:0;" title="Connection status"></span>
    </div>
  </div>
  <div class="form-row">
    <label for="node-input-outputMode"><i class="fa fa-list"></i> Output</label>
    <select id="node-input-outputMode" style="width:70%;">
      <option value="single">Single value</option>
      <option value="object">Object (key=address)</option>
      <option value="buffer">Raw Buffer</option>
      <option value="struct">Struct (schema)</option>
      <option value="bits">Bit Array</option>
    </select>
  </div>
  <div id="s7r-buffer-hint" style="display:none;" class="form-tips s7-tip">
    <p>Reads raw bytes from the PLC. Use <code>DB1,BYTE0.0.100</code> to read 100 bytes from DB1 offset 0.</p>
    <p><code>msg.payload</code> will be a Node.js <code>Buffer</code>.</p>
  </div>
  <div id="s7r-bits-hint" style="display:none;" class="form-tips s7-tip">
    <p>Reads bytes and unpacks them into a boolean array (LSB first).</p>
    <p>Use <code>DB1,BYTE0.0.2</code> to read 2 bytes = 16 bits. <code>msg.payload</code> will be <code>[true, false, ...]</code>.</p>
  </div>
  <div id="s7r-struct-hint" style="display:none;" class="form-tips s7-tip">
    <p>Reads a data block area and extracts fields according to the schema. The address is the DB area
    to start from (e.g. <code>DB1,BYTE0</code>).</p>
  </div>
  <div class="form-row">
    <label for="node-input-addressProp"><i class="fa fa-sign-in"></i> Address src</label>
    <input type="text" id="node-input-addressProp" style="width:70%;">
    <input type="hidden" id="node-input-addressType">
  </div>
  <div id="s7r-address-src-tip" class="form-tips s7-tip" style="display:none;">
    <p class="s7r-src-many"><code class="s7r-address-src">msg.topic</code> can be a single address
    (<code>"DB1,INT4"</code>), multiple addresses separated by spaces or semicolons
    (<code>"DB1,INT4 DB1,REAL8"</code>), an object of labels and addresses
    (<code>{"speed": "DB1,INT4", "temp": "DB1,REAL8"}</code>) or an array
    (<code>["DB1,INT4", "DB1,REAL8"]</code>).</p>
    <p class="s7r-src-single">A single address, or an object or array with only one entry, outputs just the
    value. Two or more addresses output an object, keyed by label when you send an object and by address
    otherwise. To always get an object, set Output to Object.</p>
    <p class="s7r-src-object">The payload is always an object, keyed by label when you send an object and by
    address otherwise.</p>
    <p class="s7r-src-one"><code class="s7r-address-src">msg.topic</code> must hold one address string, for
    example <code>"DB1,BYTE0.0.100"</code>.</p>
  </div>
  <div id="s7r-address-list-section">
    <div class="form-row">
      <label style="vertical-align:top;"><i class="fa fa-map-marker"></i> Addresses</label>
      <div style="display:inline-block;width:70%;">
        <div style="margin-bottom:4px;">
          <button type="button" id="s7r-browse-btn" class="red-ui-button red-ui-button-small" title="Browse PLC addresses"><i class="fa fa-search"></i> Browse</button>
          <button type="button" id="s7r-import-btn" class="red-ui-button red-ui-button-small" title="Import tag list from CSV, Excel, a TIA Portal tag table export (.xlsx, .xml, .sdf), or a STEP 7 .cfg hardware export"><i class="fa fa-upload"></i> Import CSV/Excel/CFG/XML</button>
        </div>
      </div>
    </div>
    <div id="s7r-browse-dialog" style="display:none;border:1px solid #ccc;border-radius:4px;padding:8px;margin:0 0 12px;background:#fafafa;max-height:400px;overflow:hidden;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <b><i class="fa fa-sitemap"></i> PLC Address Browser</b>
        <div>
          <button type="button" id="s7r-browse-refresh" class="red-ui-button red-ui-button-small" style="margin-right:4px;"><i class="fa fa-refresh"></i></button>
          <button type="button" id="s7r-browse-close" class="red-ui-button red-ui-button-small"><i class="fa fa-times"></i></button>
        </div>
      </div>
      <input type="text" id="s7r-browse-filter" placeholder="Filter (e.g. DB1, REAL, Merker...)" style="width:100%;margin-bottom:6px;padding:4px;">
      <div id="s7r-browse-status" style="padding:8px;color:#666;display:none;"></div>
      <div id="s7r-browse-results" style="max-height:300px;overflow-y:auto;"></div>
    </div>
    <div class="form-row s7r-list-row">
      <ol id="s7r-address-list"></ol>
    </div>
  </div>
  <div id="s7r-single-address-section" style="display:none;">
    <div class="form-row">
      <label for="s7r-single-address-input"><i class="fa fa-map-marker"></i> Address</label>
      <input type="text" id="s7r-single-address-input" placeholder="DB1,BYTE0.0.100" style="width:70%;">
    </div>
  </div>
  <div id="s7r-schema-section" style="display:none;">
    <div class="form-row">
      <label for="node-input-schemaProp"><i class="fa fa-th-list"></i> Schema</label>
      <input type="text" id="node-input-schemaProp" style="width:70%;">
      <input type="hidden" id="node-input-schemaType">
    </div>
    <div id="s7r-schema-src-tip" class="form-tips s7-tip" style="display:none;">
      <p><code class="s7r-schema-src">msg.schema</code> must hold the schema: an array of fields such as
      <code>[{"name": "temp", "type": "REAL", "offset": 0}]</code>, or the same as a JSON string. A BOOL
      field also takes <code>"bit"</code>, a STRING or WSTRING <code>"length"</code>.</p>
    </div>
    <div class="form-row s7r-list-row">
      <ol id="s7r-schema-list"></ol>
    </div>
  </div>
</script>

<script type="text/html" data-help-name="s7-read">
  <p>Reads data from a Siemens S7 PLC. Any incoming message triggers a read.</p>
  <h3>Inputs</h3>
  <p>By default the node reads the addresses and schema set in it, and nothing in the message
  changes them. To take them from the message instead, change <b>Address src</b>
  or <b>Schema</b> from <i>Fixed</i> to a source:</p>
  <dl class="message-properties">
    <dt class="optional">Address src <span class="property-type">msg | flow | global | env</span></dt>
    <dd>The property holding the addresses: a string (space- or semicolon-separated, e.g.
    <code>"DB1,REAL4 DB1,INT8"</code>), an array of addresses, or an object of
    <code>{ label: address }</code>, whose labels become the output keys. Choosing <code>msg</code>
    starts from <code>msg.topic</code>. Buffer, bits and struct output read one address.</dd>
    <dt class="optional">Schema <span class="property-type">msg | flow | global</span></dt>
    <dd>The property holding the struct schema, as an array or a JSON string (struct output only).
    Choosing <code>msg</code> starts from <code>msg.schema</code>.</dd>
    <dt class="optional">action <span class="property-type">string</span></dt>
    <dd>With <b>Dynamic control</b> on in the <code>s7-config</code>: <code>connect</code>, <code>disconnect</code>,
    <code>reconnect</code> or <code>status</code>. The message then acts on the connection instead of reading.
    When it has finished, the message is sent on with the connection report as <code>msg.payload</code> and the action as <code>msg.s7.op</code>. See the <code>s7-config</code> help.
    Ignored while Dynamic control is off.</dd>
  </dl>
  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>The value read from the PLC (type depends on output mode). If some addresses can't be read (a
    wrong offset, a missing DB), the others are still sent, the failed ones as <code>null</code>, and the node
    logs a warning naming them. If none can be read, the node reports an error instead of sending.</dd>
    <dt>s7 <span class="property-type">object</span></dt>
    <dd>What was read, for routing and logging:
      <ul>
        <li><code>op</code>: <code>"read"</code></li>
        <li><code>server</code>: the <code>s7-config</code>'s name, or host:port when it has none</li>
        <li><code>source</code>: <code>"config"</code> for the addresses set in this node, otherwise the
        property they came from, such as <code>"flow.plc.address"</code></li>
        <li><code>address</code>: the address, when one was read</li>
        <li><code>addresses</code>: when <code>msg.payload</code> is keyed by label or address (Object
        output, or several addresses), the same keys, each with its address</li>
        <li><code>timestamp</code>: when the message was sent, ms since 1970</li>
        <li><code>durationMs</code>: from the message arriving to it being sent</li>
      </ul>
    Any <code>msg.s7</code> on the input message is replaced.</dd>
  </dl>
  <h3>Output Modes</h3>
  <dl>
    <dt>Single value</dt>
    <dd>Reads one address and returns the scalar value. Given more than one address, it returns an
    object as Object output does.</dd>
    <dt>Object</dt>
    <dd>Reads one or more addresses and returns an object. Keys are the label (if set) or address.
    <b>Add address</b> starts the new row from the one above it, with the same type and notation:
    <code>DB1,REAL0</code> is followed by <code>DB1,REAL4</code>, <code>MW10</code> by <code>MW12</code>,
    <code>I0.7</code> by <code>I1.0</code>, and a label ending in a number counts on. The guess is
    selected, so typing replaces it. It follows a run of one type in a DB without optimized block
    access; with optimized access (the S7-1200/1500 default) there are no fixed offsets to follow.
    Use <b>Import CSV/Excel/CFG/XML</b> to bulk-import tag lists from a TIA Portal tag table Export (.xlsx, .xml or .sdf), Step 7 symbol exports (.csv/.tsv), or STEP 7 V5 hardware configuration exports (.cfg). The CSV importer auto-detects column names (<code>name</code>/<code>symbol</code>/<code>tag</code> and <code>address</code>) and supports tab, semicolon and comma separators. IEC-style addresses with <code>%</code> prefix are converted automatically.<br>
    <b>.cfg import</b> reads the full hardware config exported from SIMATIC Manager via <em>Station → Export…</em> and extracts all symbolic I/O — including modules behind Profibus/Profinet couplers that a live browse cannot discover. Digital inputs/outputs become <code>I0.3</code>/<code>Q0.3</code> addresses, analog channels become <code>IW272</code>/<code>QW272</code>.<br>
    <b>TIA Portal .xml / .sdf import</b> reads a tag table exported from TIA Portal via <em>PLC tags → &lt;table&gt; → Export</em> (Save as type Xml or Sdf). The .xml import also reads SimaticML (<code>SW.Tags.PlcTagTable</code>) as written by TIA Portal Openness; for SimaticML, multilingual comments prefer <code>de-DE</code>, then <code>en-US</code>. User constants (no address) are skipped.</dd>
    <dt>Raw Buffer</dt>
    <dd>Reads N bytes and returns a Node.js Buffer. Address format: <code>DB1,BYTE0.0.100</code> (100 bytes from offset 0). Useful for JSON strings in DBs or custom binary parsing.</dd>
    <dt>Struct (schema)</dt>
    <dd>Reads a raw buffer area and extracts typed fields according to a schema. Each field specifies name, data type, and byte offset. Example schema:
    <pre>[{"name":"temp","type":"REAL","offset":0},
 {"name":"count","type":"INT","offset":4},
 {"name":"active","type":"BOOL","offset":6,"bit":0}]</pre>
    Returns: <code>{"temp":23.5,"count":42,"active":true}</code>
    <b>Add field</b> starts the new field from the one above it: the same type, and the same length
    for a string, at the next free offset, or the next bit for a BOOL. Only the name is left to type.</dd>
    <dt>Bit Array</dt>
    <dd>Reads N bytes and returns an array of booleans (LSB first per byte). Address format: <code>DB1,BYTE0.0.2</code> (2 bytes = 16 bits). Useful for status words and bitmasks.</dd>
  </dl>
  <h3>Dates and times</h3>
  <p>Use <b>DT</b> for a <code>DATE_AND_TIME</code> in the PLC (8 bytes, milliseconds, 1990 to 2089) and
  <b>DTL</b> for a <code>DTL</code> (12 bytes, S7-1200/1500 only, 1970 to 2262). Both are read as a JavaScript
  <code>Date</code>. The debug sidebar shows a Date as its ISO string, in UTC.</p>
  <p>The PLC stores a date without a time zone. <b>DT</b> and <b>DTL</b> treat it as local time on the
  Node-RED server, so use them when the PLC holds its local clock. <b>DTZ</b> and <b>DTLZ</b> read the same
  bytes as UTC, for a PLC that keeps UTC (for example the S7-1500 system time). The wrong choice puts every
  value off by the server's UTC offset. <b>DATE_AND_TIME</b> is the same as DTZ but returns an ISO string.</p>
</script>
