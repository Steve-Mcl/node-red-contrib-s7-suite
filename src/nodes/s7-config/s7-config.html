<script type="text/javascript">
  // ===== Shared S7 Suite functions (loaded once via config node) =====

  // Connection status dot - polls state every 3s while editor is open
  window.s7SuiteStatusDot = function (serverSelectId, dotId) {
    // Node-RED wraps the config select and its edit/add buttons in its own 70%-wide flex box
    // inside our row. A long config label (e.g. "host:${PLC_PORT}") stops the select shrinking,
    // which pushes the buttons out under the dot. Let the select shrink and the wrapper fill the
    // row up to the dot instead.
    var select = $(serverSelectId).css('min-width', 0);
    var wrapper = select.parent();
    if (!wrapper.is($(dotId).parent())) {
      wrapper.css({ width: 'auto', flex: '1 1 auto', 'min-width': 0 });
    }
    var interval = null;
    function update() {
      var id = $(serverSelectId).val();
      if (!id) { $(dotId).css('background', '#999').attr('title', 'No server selected'); return; }
      $.getJSON('s7-suite/connection-state/' + id, function (data) {
        var colors = { connected: '#4CAF50', connecting: '#FFC107', reconnecting: '#FFC107', error: '#F44336', disconnected: '#999' };
        $(dotId).css('background', colors[data.state] || '#999').attr('title', data.state || 'unknown');
      }).fail(function () {
        $(dotId).css('background', '#999').attr('title', 'unknown');
      });
    }
    update();
    interval = setInterval(update, 3000);
    $(serverSelectId).on('change', update);
    // Cleanup when editor closes (RED will destroy elements)
    setTimeout(function () {
      var check = setInterval(function () {
        if ($(dotId).length === 0) { clearInterval(interval); clearInterval(check); }
      }, 2000);
    }, 1000);
  };

  // Keyboard accelerator for an editableList's Add button: a native accesskey, the letter
  // underlined in the label, and a tooltip naming the keys (the modifier depends on browser/OS).
  // Pass enabled=false for a list that is currently hidden, so two lists sharing a key in one
  // dialog can't both claim it.
  window.s7SuiteAccelerator = function (list, key, enabled) {
    var btn = list.closest('.red-ui-editableList').children('.red-ui-editableList-addButton').first();
    if (enabled === false) {
      btn.removeAttr('accesskey');
      return;
    }
    var span = btn.children('span').first();
    var text = span.text();
    var i = text.toLowerCase().indexOf(key.toLowerCase());
    if (i >= 0 && span.children('u').length === 0) {
      span.empty().append(
        document.createTextNode(text.slice(0, i)),
        $('<u>').text(text.charAt(i)),
        document.createTextNode(text.slice(i + 1))
      );
    }
    var ua = navigator.userAgent;
    var combo = /Mac|iPhone|iPad/.test(navigator.platform || ua) ? 'Control+Option+'
      : /Firefox\//.test(ua) ? 'Alt+Shift+' : 'Alt+';
    btn.attr('accesskey', key).attr('title', text.trim() + ' (' + combo + key.toUpperCase() + ')');
  };

  // Browse dialog with tree/category structure
  // opts: { btnId, closeId, filterId, statusId, resultsId, dialogId, serverId, addressId, mode: 'replace'|'append'|'list', listRef }
  window.s7SuiteBrowseDialog = function (opts) {
    // The browser's height changes as it opens, loads, filters and expands; let the node's
    // oneditresize give its lists what is left
    function resize() {
      if (RED.tray && RED.tray.resize) RED.tray.resize();
    }
    function hideDialog() {
      $(opts.dialogId).hide();
      resize();
    }

    function fetchAndRenderBrowse() {
      var serverId = $(opts.serverId).val();
      if (!serverId) { RED.notify('Select a server first', 'warning'); return; }
      // Colours go in the markup: jQuery UI's colour hooks turn css('color', 'var(...)') into
      // the fallback, which ignores the editor theme
      $(opts.statusId).text('Browsing...').show();
      $(opts.resultsId).empty();
      $(opts.dialogId).show();
      resize();
      $.getJSON('s7-suite/browse/' + serverId, function (data) {
        $(opts.statusId).hide();
        var addresses = data.addresses || [];

        // Group into categories
        var groups = {};
        addresses.forEach(function (a) {
          var cat = a.info || 'Other';
          // Extract DB name for grouping: "DB1 (100 bytes)" -> "DB1"
          var m = cat.match(/^(DB\d+)/);
          if (m) cat = m[1] + ' (' + (a.info || '') + ')';
          else if (cat === 'Merker') cat = 'Merker (M)';
          else if (cat === 'Input') cat = 'Inputs (I)';
          else if (cat === 'Output') cat = 'Outputs (Q)';
          else if (cat === 'Counter') cat = 'Counters (C)';
          else if (cat === 'Timer') cat = 'Timers (T)';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(a);
        });

        // An address field may be a typedInput (s7-write); a browsed address is a fixed one
        function getAddress() {
          var el = $(opts.addressId);
          return el.data('noderedTypedInput') ? el.typedInput('value') : el.val();
        }
        function setAddress(value) {
          var el = $(opts.addressId);
          if (el.data('noderedTypedInput')) {
            el.typedInput('type', 'str');
            el.typedInput('value', value);
          } else {
            el.val(value);
          }
        }

        function selectAddress(addr) {
          if (opts.mode === 'list' && opts.listRef) {
            opts.listRef.editableList('addItem', { address: addr });
            RED.notify('Added: ' + addr, 'success');
          } else if (opts.mode === 'append') {
            var cur = (getAddress() || '').trim();
            if (cur) cur += ' ';
            setAddress(cur + addr);
            RED.notify('Added: ' + addr, 'success');
          } else {
            setAddress(addr);
            hideDialog();
          }
        }

        function render(f) {
          var container = $('<div></div>');
          var totalCount = 0;
          var sortedKeys = Object.keys(groups).sort(function (a, b) {
            // DBs first (sorted numerically), then M, I, Q
            var da = a.match(/^DB(\d+)/), db2 = b.match(/^DB(\d+)/);
            if (da && db2) return parseInt(da[1]) - parseInt(db2[1]);
            if (da) return -1;
            if (db2) return 1;
            return a.localeCompare(b);
          });

          sortedKeys.forEach(function (cat) {
            var items = groups[cat];
            var filtered = f ? items.filter(function (a) {
              return a.address.toLowerCase().indexOf(f.toLowerCase()) !== -1 ||
                     a.type.toLowerCase().indexOf(f.toLowerCase()) !== -1 ||
                     (a.info && a.info.toLowerCase().indexOf(f.toLowerCase()) !== -1);
            }) : items;
            if (filtered.length === 0) return;

            // Category header (collapsible)
            var section = $('<div style="margin-bottom:2px;"></div>');
            var header = $('<div style="background:var(--red-ui-secondary-background-selected, #e3f2fd);padding:4px 8px;cursor:pointer;border-radius:3px;font-weight:bold;font-size:12px;display:flex;align-items:center;user-select:none;"></div>');
            var arrow = $('<i class="fa fa-caret-right" style="margin-right:6px;width:10px;transition:transform 0.2s;"></i>');
            header.append(arrow);
            header.append('<span>' + cat + ' <span style="color:var(--red-ui-tertiary-text-color, #888);font-weight:normal;">(' + filtered.length + ')</span></span>');
            section.append(header);

            var body = $('<div style="display:none;"></div>');
            var tbl = $('<table style="width:100%;border-collapse:collapse;font-size:12px;"></table>');

            var shown = 0;
            filtered.forEach(function (a) {
              if (shown++ >= 100) return;
              totalCount++;
              var tr = $('<tr style="border-bottom:1px solid var(--red-ui-secondary-border-color, #eee);cursor:pointer;"></tr>');
              tr.on('mouseover', function () { $(this).css('background', 'var(--red-ui-list-item-background-hover, #f5f5f5)'); });
              tr.on('mouseout', function () { $(this).css('background', ''); });
              tr.append($('<td style="padding:2px 4px;font-family:monospace;font-size:11px;"></td>').text(a.address));
              tr.append($('<td style="padding:2px 4px;text-align:center;color:var(--red-ui-secondary-text-color, #1565C0);font-size:11px;"></td>').text(a.type));
              var valTd = $('<td style="padding:2px 4px;text-align:right;font-family:monospace;font-size:11px;white-space:nowrap;color:var(--red-ui-primary-text-color, #333);"></td>');
              if (a.value === null || a.value === undefined) {
                valTd.append($('<span style="color:var(--red-ui-tertiary-text-color, #999);"></span>').text('-'));
              } else if (typeof a.value === 'boolean') {
                var boolColor = a.value ? 'var(--red-ui-text-color-success, #4CAF50)' : 'var(--red-ui-text-color-error, #F44336)';
                valTd.append($('<span style="color:' + boolColor + ';"></span>').text(String(a.value)));
              } else if (typeof a.value === 'number') {
                var numStr = (a.value % 1 !== 0) ? a.value.toFixed(4).replace(/0+$/, '').replace(/\.$/, '') : String(a.value);
                valTd.text(numStr);
              } else {
                valTd.text(String(a.value));
              }
              tr.append(valTd);
              var btn = $('<button class="red-ui-button red-ui-button-small" style="padding:0 6px;font-size:10px;">Select</button>');
              btn.on('click', function (e) { e.stopPropagation(); selectAddress(a.address); });
              var td = $('<td style="padding:2px 4px;text-align:right;"></td>').append(btn);
              tr.append(td);
              tr.on('click', function () { btn.trigger('click'); });
              tbl.append(tr);
            });
            if (shown > 100) {
              tbl.append('<tr><td colspan="4" style="padding:4px;color:var(--red-ui-tertiary-text-color, #999);font-size:11px;">' + (filtered.length - 100) + ' more... use filter</td></tr>');
            }
            body.append(tbl);
            section.append(body);

            header.on('click', function () {
              var visible = body.is(':visible');
              body.slideToggle(150, resize);
              arrow.css('transform', visible ? '' : 'rotate(90deg)');
            });

            container.append(section);
          });

          if (totalCount === 0) {
            container.append('<div style="padding:8px;color:var(--red-ui-tertiary-text-color, #999);">No matches</div>');
          }
          $(opts.resultsId).empty().append(container);
          resize();
        }

        render('');
        $(opts.filterId).off('input').on('input', function () { render($(this).val()); });
      }).fail(function (xhr) {
        var msg = xhr.responseJSON ? xhr.responseJSON.error : 'Browse failed';
        $(opts.statusId).empty().append($('<span style="color:var(--red-ui-text-color-error, red);"></span>').text(msg));
        resize();
      });
    }

    $(opts.btnId).on('click', function () { fetchAndRenderBrowse(); });
    $(opts.closeId).on('click', hideDialog);
    // Refresh button support: if opts.refreshId is provided, bind it
    if (opts.refreshId) {
      $(opts.refreshId).on('click', function () { fetchAndRenderBrowse(); });
    }
  };

  // Start a new struct schema row from the one above it: the same type (and string length) at
  // the next free offset, or the next bit for a BOOL. The name is left empty for the user to type.
  // `field` holds the new row's { type, offset, bit, len } inputs. Rows are read by position, as
  // the nodes' oneditsave does: inputs are name, offset, bit, length, and one select for the type.
  window.s7SuiteSeedSchemaField = function (row, field) {
    var previous = row.closest('li').prev('li');
    if (!previous.length) return;
    var inputs = previous.find('input');
    var query = {
      type: previous.find('select').val(),
      offset: $(inputs[1]).val(),
      bit: $(inputs[2]).val(),
      length: $(inputs[3]).val()
    };
    if (!query.type || query.offset === '') return;
    $.getJSON('s7-suite/next-field', query, function (next) {
      // Leave a row the user has already started filling in
      if (!next || next.offset === undefined || field.offset.val() !== '') return;
      field.type.val(next.type).trigger('change');
      field.offset.val(next.offset);
      field.bit.val(next.bit !== undefined ? next.bit : '');
      field.len.val(next.length !== undefined ? next.length : '');
    });
  };

  // Validator for a num/env TypedInput: a whole number in [min, max] (any number in range with
  // allowFraction), or an environment variable name. RED.validators.typedInput('...Type') alone
  // accepts any number, negatives and fractions included. Returns a boolean: Node-RED 2.x treats
  // a returned string as valid. Used by config nodes (node-config-input-) and flow nodes (node-input-).
  window.s7SuiteNumberField = function (typeField, min, max, allowFraction) {
    return function (v) {
      var type = $('#node-config-input-' + typeField).val() || $('#node-input-' + typeField).val() ||
        this[typeField] || 'num';
      var text = String(v === undefined || v === null ? '' : v).trim();
      if (type === 'env') return text !== '';
      var n = Number(text);
      return text !== '' && Number.isFinite(n) && (allowFraction || Number.isInteger(n)) && n >= min && n <= max;
    };
  };

  // Validator for a str/env TSAP TypedInput: empty (TSAPs are optional), hex with or without 0x
  // (0x0100, 0100), or the dotted form LOGO! Soft Comfort shows (01.00). Mirrors parseTsap()
  // in s7-config.ts.
  window.s7SuiteTsapField = function (typeField) {
    return function (v) {
      var type = $('#node-config-input-' + typeField).val() || this[typeField] || 'str';
      var text = String(v === undefined || v === null ? '' : v).trim();
      if (type === 'env') return text !== '';
      return text === '' || /^(0x)?[0-9a-f]{1,4}$/i.test(text) || /^[0-9a-f]{1,2}\.[0-9a-f]{1,2}$/i.test(text);
    };
  };

  // ===== Config node registration =====
  RED.nodes.registerType('s7-config', {
    category: 'config',
    defaults: {
      name: { value: '' },
      host: { value: '192.168.0.1', required: true, validate: RED.validators.typedInput('hostType', true) },
      hostType: { value: 'str' },
      port: { value: 102, required: true, validate: s7SuiteNumberField('portType', 1, 65535) },
      portType: { value: 'num' },
      rack: { value: 0, required: true, validate: s7SuiteNumberField('rackType', 0, 7) },
      rackType: { value: 'num' },
      slot: { value: 1, required: true, validate: s7SuiteNumberField('slotType', 0, 31) },
      slotType: { value: 'num' },
      plcType: { value: 'S7-1200' },
      backend: { value: 'nodes7' },
      localTSAP: { value: '', validate: s7SuiteTsapField('localTSAPType') },
      localTSAPType: { value: 'str' },
      remoteTSAP: { value: '', validate: s7SuiteTsapField('remoteTSAPType') },
      remoteTSAPType: { value: 'str' },
      connectionTimeout: { value: 5000, validate: s7SuiteNumberField('connectionTimeoutType', 1, Number.MAX_SAFE_INTEGER) },
      connectionTimeoutType: { value: 'num' },
      requestTimeout: { value: 3000, validate: s7SuiteNumberField('requestTimeoutType', 1, Number.MAX_SAFE_INTEGER) },
      requestTimeoutType: { value: 'num' },
      reconnectInterval: { value: 1000, validate: s7SuiteNumberField('reconnectIntervalType', 1, Number.MAX_SAFE_INTEGER) },
      reconnectIntervalType: { value: 'num' },
      maxReconnectInterval: { value: 30000, validate: s7SuiteNumberField('maxReconnectIntervalType', 1, Number.MAX_SAFE_INTEGER) },
      maxReconnectIntervalType: { value: 'num' },
      debug: { value: false },
      int64As: { value: 'number' },
      autoConnect: { value: true },
      allowDynamic: { value: false }
    },
    credentials: {
      password: { type: 'password' }
    },
    label: function () {
      var show = function (value, type) { return type === 'env' ? '${' + value + '}' : value; };
      return this.name || show(this.host, this.hostType) + ':' + show(this.port, this.portType);
    },
    oneditprepare: function () {
      var node = this;
      var defaults = RED.nodes.getType('s7-config').defaults;
      // Each setting takes a value or the name of an environment variable
      var fields = {
        host: 'str', localTSAP: 'str', remoteTSAP: 'str',
        port: 'num', rack: 'num', slot: 'num',
        connectionTimeout: 'num', requestTimeout: 'num', reconnectInterval: 'num', maxReconnectInterval: 'num'
      };
      Object.keys(fields).forEach(function (field) {
        var input = $('#node-config-input-' + field);
        // Node-RED doesn't copy falsy defaults (rack: 0) onto a new config node, so the
        // field would start empty; fill it from the definition instead
        if (node[field] === undefined && defaults[field].value !== undefined) {
          input.val(defaults[field].value);
        }
        input.typedInput({
          default: fields[field],
          types: [fields[field], 'env'],
          typeField: '#node-config-input-' + field + 'Type'
        });
      });

      // Config nodes saved before Auto connect existed always connected; keep them that way
      if (node.autoConnect === undefined) {
        $('#node-config-input-autoConnect').prop('checked', true);
      }
      // Config nodes saved before the LINT/ULINT setting existed read them as numbers (what the
      // runtime does when it's unset); select that rather than leaving the dropdown blank
      if (node.int64As === undefined) {
        $('#node-config-input-int64As').val('number');
      }

      var plcDefaults = {};
      $.getJSON('s7-suite/plc-defaults', function (data) {
        plcDefaults = data;
      });
      $.getJSON('s7-suite/snap7-available', function (data) {
        if (!data.available) {
          $('#snap7-warning').show();
        }
      });
      $('#node-config-input-plcType').on('change', function () {
        var plcType = $(this).val();
        // Only replace a numeric slot; leave an environment variable alone
        var slotInput = $('#node-config-input-slot');
        if (plcDefaults[plcType] !== undefined && slotInput.typedInput('type') === 'num') {
          slotInput.typedInput('value', plcDefaults[plcType]);
        }
        $('.tsap-row').show();
      });
      function updateBackendInfo() {
        var val = $('#node-config-input-backend').val();
        $('#backend-info-sim, #backend-info-nodes7, #backend-info-snap7').hide();
        $('#backend-info-' + val).show();
        if (val === 'snap7') {
          $.getJSON('s7-suite/snap7-available', function (data) {
            if (!data.available) { $('#snap7-warning').show(); } else { $('#snap7-warning').hide(); }
          });
        } else {
          $('#snap7-warning').hide();
        }
      }
      $('#node-config-input-backend').on('change', updateBackendInfo);
      setTimeout(updateBackendInfo, 200);
    }
  });
</script>

<script type="text/html" data-template-name="s7-config">
  <style>
    /* Room for the longer labels ("Max Reconnect (ms)") without wrapping. The typedInputs take
       their width from the inline style on each input, so plain inputs and selects match it here */
    .s7c-form .form-row > label { width: 150px; white-space: nowrap; }
    .s7c-form .form-row > input[type="text"]:not(.red-ui-typedInput),
    .s7c-form .form-row > input[type="password"],
    .s7c-form .form-row > select { width: calc(100% - 155px); }
    /* Tips sit under the field they describe, in the input column. Node-RED sizes the edit tray
       from its content's natural width when it opens, so width:0 keeps the tip text out of that
       sum; min-width then stretches the tip to the input column once the tray width is set */
    .s7c-form .s7c-tip { box-sizing: border-box; width: 0; min-width: calc(100% - 155px); max-width: none; margin: -6px 0 16px 155px; }
  </style>
  <div class="s7c-form">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="Name">
  </div>
  <div class="form-row">
    <label for="node-config-input-host"><i class="fa fa-globe"></i> Host</label>
    <input type="text" id="node-config-input-host" placeholder="192.168.0.1" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-hostType">
  </div>
  <div class="form-row">
    <label for="node-config-input-port"><i class="fa fa-plug"></i> Port</label>
    <input type="text" id="node-config-input-port" placeholder="102" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-portType">
  </div>
  <div class="form-row">
    <label for="node-config-input-plcType"><i class="fa fa-microchip"></i> PLC Type</label>
    <select id="node-config-input-plcType">
      <option value="S7-200">S7-200</option>
      <option value="S7-300">S7-300</option>
      <option value="S7-400">S7-400</option>
      <option value="S7-1200">S7-1200</option>
      <option value="S7-1500">S7-1500</option>
      <option value="LOGO">LOGO</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-config-input-rack"><i class="fa fa-server"></i> Rack</label>
    <input type="text" id="node-config-input-rack" placeholder="0" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-rackType">
  </div>
  <div class="form-row">
    <label for="node-config-input-slot"><i class="fa fa-th"></i> Slot</label>
    <input type="text" id="node-config-input-slot" placeholder="1" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-slotType">
  </div>
  <div class="form-row">
    <label for="node-config-input-backend"><i class="fa fa-cogs"></i> Backend</label>
    <select id="node-config-input-backend">
      <option value="sim">Simulator &mdash; no PLC needed, generates test data</option>
      <option value="nodes7">nodes7 &mdash; pure JS, works everywhere, no block listing</option>
      <option value="snap7">snap7 &mdash; native C, fast, block listing &amp; SZL reads</option>
    </select>
  </div>
  <div id="snap7-warning" class="form-tips s7c-tip" style="display:none;"><i class="fa fa-warning"></i> <b>node-snap7</b> is not installed. It is an optional native C library that requires a C compiler to build.<br>
    Install: <code>npm install node-snap7</code><br>
    <small>If compilation fails, install build tools first (e.g. <code>apt install build-essential</code> on Debian/Ubuntu).<br>
    Without snap7, use the <b>nodes7</b> backend instead &mdash; it supports the same Read/Write/Trigger features, only block listing and SZL reads are unavailable.</small>
  </div>
  <div id="backend-info">
    <div id="backend-info-sim" class="form-tips s7c-tip" style="display:none;">
      <b>Simulator:</b> Generates dynamic test data (sine wave, counter, sawtooth) without a real PLC. Useful for flow development and testing.
    </div>
    <div id="backend-info-nodes7" class="form-tips s7c-tip" style="display:none;">
      <b>nodes7:</b> Pure JavaScript &mdash; works on any platform without compilation. Supports all Read/Write/Trigger operations. Browse uses probe-based discovery (slower). Does not support block listing or SZL reads.
    </div>
    <div id="backend-info-snap7" class="form-tips s7c-tip" style="display:none;">
      <b>snap7:</b> Native C library via node-snap7 &mdash; supports all features including fast block listing, SZL reads, and CPU diagnostics. Requires a C compiler for installation.
    </div>
  </div>
  <div class="form-row">
    <label for="node-config-input-password"><i class="fa fa-lock"></i> Password</label>
    <input type="password" id="node-config-input-password" placeholder="Session password (optional)">
  </div>
  <div class="form-tips s7c-tip">
    <small>PLC session password. Only used with the <b>snap7</b> backend.</small>
  </div>
  <div class="form-row tsap-row">
    <label for="node-config-input-localTSAP"><i class="fa fa-exchange"></i> Local TSAP</label>
    <input type="text" id="node-config-input-localTSAP" placeholder="0x0100" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-localTSAPType">
  </div>
  <div class="form-row tsap-row">
    <label for="node-config-input-remoteTSAP"><i class="fa fa-exchange"></i> Remote TSAP</label>
    <input type="text" id="node-config-input-remoteTSAP" placeholder="0x0200" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-remoteTSAPType">
  </div>
  <div class="form-row">
    <label for="node-config-input-connectionTimeout"><i class="fa fa-clock-o"></i> Conn. Timeout (ms)</label>
    <input type="text" id="node-config-input-connectionTimeout" placeholder="5000" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-connectionTimeoutType">
  </div>
  <div class="form-row">
    <label for="node-config-input-requestTimeout"><i class="fa fa-clock-o"></i> Req. Timeout (ms)</label>
    <input type="text" id="node-config-input-requestTimeout" placeholder="3000" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-requestTimeoutType">
  </div>
  <div class="form-row">
    <label for="node-config-input-reconnectInterval"><i class="fa fa-refresh"></i> Reconnect (ms)</label>
    <input type="text" id="node-config-input-reconnectInterval" placeholder="1000" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-reconnectIntervalType">
  </div>
  <div class="form-row">
    <label for="node-config-input-maxReconnectInterval"><i class="fa fa-refresh"></i> Max Reconnect (ms)</label>
    <input type="text" id="node-config-input-maxReconnectInterval" placeholder="30000" style="width: calc(100% - 155px);">
    <input type="hidden" id="node-config-input-maxReconnectIntervalType">
  </div>
  <div class="form-row">
    <label for="node-config-input-autoConnect"><i class="fa fa-link"></i> Auto connect</label>
    <input type="checkbox" id="node-config-input-autoConnect" style="display:inline-block; width:auto; vertical-align:top;">
  </div>
  <div class="form-tips s7c-tip">
    <small>Connect on deploy and retry after a failure or a lost link. Turn off to connect only when a
    flow sends <code>msg.action</code> <code>"connect"</code> (needs Dynamic control).</small>
  </div>
  <div class="form-row">
    <label for="node-config-input-allowDynamic"><i class="fa fa-random"></i> Dynamic control</label>
    <input type="checkbox" id="node-config-input-allowDynamic" style="display:inline-block; width:auto; vertical-align:top;">
  </div>
  <div class="form-tips s7c-tip">
    <small>The read, write, control and browse nodes on this connection accept <code>msg.action</code>:
    <code>connect</code>, <code>disconnect</code>, <code>reconnect</code> or <code>status</code>. Off,
    <code>msg.action</code> is ignored.</small>
  </div>
  <div class="form-row">
    <label for="node-config-input-int64As"><i class="fa fa-hashtag"></i> LINT/ULINT as</label>
    <select id="node-config-input-int64As">
      <option value="number">Number (exact up to 2^53)</option>
      <option value="bigint">BigInt (exact)</option>
      <option value="string">String (exact)</option>
    </select>
  </div>
  <div class="form-row">
    <label for="node-config-input-debug" style="width:auto;"><i class="fa fa-bug"></i> Debug logging</label>
    <input type="checkbox" id="node-config-input-debug" style="display:inline-block; width:auto; vertical-align:top;">
    <span style="color:var(--red-ui-tertiary-text-color, #888); font-size:0.85em;">Logs raw protocol traffic (nodes7) to stdout. Leave off for normal use.</span>
  </div>
  </div>
</script>

<script type="text/html" data-help-name="s7-config">
  <p>Configuration node for Siemens S7 PLC connections.</p>
  <h3>Properties</h3>
  <dl class="message-properties">
    <dt>Host <span class="property-type">string | env</span></dt>
    <dd>IP address or hostname of the PLC</dd>
    <dt>Port <span class="property-type">number | env</span></dt>
    <dd>TCP port (default: 102)</dd>
    <dt>Rack / Slot <span class="property-type">number | env</span></dt>
    <dd>PLC rack and slot numbers. Choosing a PLC type fills in its usual slot, unless the slot is set from an environment variable.</dd>
    <dt class="optional">Local / Remote TSAP <span class="property-type">string | env</span></dt>
    <dd>Connect by TSAP instead of rack and slot, as LOGO! and S7-200 need (e.g. LOGO! local <code>0x0100</code>, remote <code>0x0200</code>). TSAPs are hex: <code>0x0100</code>, <code>0100</code> and <code>01.00</code> (the form LOGO! Soft Comfort shows) all mean the same. A decimal number is read as hex too, so <code>256</code> means 0x0256, not 0x0100.</dd>
    <dt>Environment variables</dt>
    <dd>Host, port, rack, slot, the TSAPs, timeouts and reconnect intervals can each be set directly or, by switching the field to <b>env</b>, from the named environment variable (Node-RED's global or flow environment variables, or the process environment). An unset variable, or a non-numeric one for a numeric field, stops the connection and is reported as a config error rather than falling back to a default.</dd>
    <dt>PLC Type <span class="property-type">select</span></dt>
    <dd>S7-200, S7-300, S7-400, S7-1200, S7-1500, or LOGO</dd>
    <dt>Backend <span class="property-type">select</span></dt>
    <dd>Communication library to use</dd>
    <dt>LINT/ULINT as <span class="property-type">select</span></dt>
    <dd>How 64-bit integers are returned. <b>Number</b> (the default) is exact up to 2^53
    (9007199254740991) and loses precision above that. <b>BigInt</b> is always exact, but a
    payload containing one can't be turned into JSON, so MQTT, HTTP and the JSON node will fail
    on it, and it can't be mixed with numbers in arithmetic. <b>String</b> is always exact and safe
    to send anywhere. Writes accept any of the three.
    With the <b>nodes7</b> backend, LINT and ULINT only work in s7-read's struct mode for now: nodes7
    itself can't read or write them, so other reads and writes are refused. Use snap7 for those.</dd>
    <dt>Auto connect <span class="property-type">boolean</span></dt>
    <dd>On (the default), the connection opens on deploy and retries after a failure or a lost link,
    backing off up to <b>Max Reconnect</b>. Off, it stays down until a flow sends
    <code>msg.action</code> <code>"connect"</code>, and a failure or lost link is not retried: it waits
    for the next <code>connect</code> or <code>reconnect</code>. Needs <b>Dynamic control</b>.</dd>
    <dt>Dynamic control <span class="property-type">boolean</span></dt>
    <dd>Off (the default), <code>msg.action</code> is ignored. On, the <code>s7-read</code>,
    <code>s7-write</code>, <code>s7-control</code> and <code>s7-browse</code> nodes using this connection
    act on <code>msg.action</code> instead of doing their usual work:
      <ul>
        <li><code>connect</code>: connect now. Already connected is a success. A pending retry is
        brought forward.</li>
        <li><code>disconnect</code>: disconnect, and don't retry until told to connect.</li>
        <li><code>reconnect</code>: disconnect then connect, with the retry backoff reset.</li>
        <li><code>status</code>: send the message on with <code>msg.payload</code> set to the
        connection report: <code>state</code> (<code>connected</code>, <code>connecting</code>,
        <code>reconnecting</code>, <code>error</code> or <code>disconnected</code>), <code>since</code>
        (when it entered that state, ms since 1970), <code>lastError</code> and
        <code>lastErrorAt</code>, <code>configError</code>, and the backend, host, port, rack, slot and
        PLC type. <code>msg.s7</code> holds <code>op</code> (<code>"status"</code>), <code>server</code>,
        <code>timestamp</code> and <code>durationMs</code>, as on a read or write. Wire the reply to a
        debug or switch node rather than straight into another S7 node, which would treat it as an
        ordinary message to read or write with.</li>
      </ul>
    The action acts on the connection, so every node using this <code>s7-config</code> sees the result.
    <code>connect</code>, <code>disconnect</code> and <code>reconnect</code> send nothing on: to carry
    on once one has finished, use a Complete node. A failed <code>connect</code> or
    <code>reconnect</code> is reported as the node's error, so a Catch node can handle it. Other values
    of <code>msg.action</code> are an error.</dd>
    <dt>Debug logging <span class="property-type">boolean</span></dt>
    <dd>When enabled, the <code>nodes7</code> backend prints raw protocol trace
    output (every read/poll cycle) to stdout. Disabled by default to avoid
    flooding container logs; only turn on for troubleshooting.</dd>
  </dl>
  <h3>Backends</h3>
  <table style="width:100%;border-collapse:collapse;font-size:13px;">
    <thead>
      <tr style="background:var(--red-ui-secondary-background-selected, #e3f2fd);">
        <th style="padding:4px 8px;text-align:left;border-bottom:2px solid var(--red-ui-tertiary-border-color, #90CAF9);">Feature</th>
        <th style="padding:4px 8px;text-align:center;border-bottom:2px solid var(--red-ui-tertiary-border-color, #90CAF9);">Simulator</th>
        <th style="padding:4px 8px;text-align:center;border-bottom:2px solid var(--red-ui-tertiary-border-color, #90CAF9);">nodes7</th>
        <th style="padding:4px 8px;text-align:center;border-bottom:2px solid var(--red-ui-tertiary-border-color, #90CAF9);">snap7</th>
      </tr>
    </thead>
    <tbody>
      <tr><td style="padding:3px 8px;">Language</td><td style="text-align:center;">JS (built-in)</td><td style="text-align:center;">Pure JS</td><td style="text-align:center;">Native C</td></tr>
      <tr><td style="padding:3px 8px;">Requires PLC</td><td style="text-align:center;">No</td><td style="text-align:center;">Yes</td><td style="text-align:center;">Yes</td></tr>
      <tr><td style="padding:3px 8px;">Requires C compiler</td><td style="text-align:center;">No</td><td style="text-align:center;">No</td><td style="text-align:center;">Yes</td></tr>
      <tr><td style="padding:3px 8px;">Read / Write</td><td style="text-align:center;">Yes</td><td style="text-align:center;">Yes</td><td style="text-align:center;">Yes</td></tr>
      <tr><td style="padding:3px 8px;">Trigger (polling)</td><td style="text-align:center;">Yes</td><td style="text-align:center;">Yes</td><td style="text-align:center;">Yes</td></tr>
      <tr><td style="padding:3px 8px;">Browse (block listing)</td><td style="text-align:center;">Simulated</td><td style="text-align:center;">Probe-based (slow)</td><td style="text-align:center;">Native API (fast)</td></tr>
      <tr><td style="padding:3px 8px;">SZL / CPU diagnostics</td><td style="text-align:center;">Simulated</td><td style="text-align:center;">No</td><td style="text-align:center;">Yes</td></tr>
      <tr><td style="padding:3px 8px;">Best for</td><td style="text-align:center;">Development</td><td style="text-align:center;">Production (easy setup)</td><td style="text-align:center;">Production (full features)</td></tr>
    </tbody>
  </table>
  <p style="margin-top:8px;"><b>Recommendation:</b> Use <b>nodes7</b> if you just need Read/Write/Trigger &mdash; it works everywhere without compilation.
  Use <b>snap7</b> if you need block listing, CPU diagnostics, or SZL reads.
  Use <b>Simulator</b> for development and testing without a PLC.</p>
  <p><code>node-snap7</code> is listed as an optional dependency. If compilation fails during <code>npm install</code>,
  the package still installs successfully &mdash; only the snap7 backend will be unavailable.</p>
  <h3>TSAP Configuration (LOGO)</h3>
  <p>For Siemens LOGO PLCs, use TSAP addresses instead of rack/slot:</p>
  <ul>
    <li><b>Local TSAP:</b> e.g. <code>0x0100</code></li>
    <li><b>Remote TSAP:</b> e.g. <code>0x0200</code></li>
  </ul>
  <h3>Connection Settings</h3>
  <ul>
    <li><b>Connection Timeout:</b> Maximum time to establish connection (ms)</li>
    <li><b>Request Timeout:</b> Maximum time for a read/write request (ms)</li>
    <li><b>Reconnect Interval:</b> Initial delay before reconnection attempt (ms)</li>
    <li><b>Max Reconnect Interval:</b> Maximum delay with exponential backoff (ms)</li>
  </ul>
</script>
